# Profiling container for the FreeDSx server
services:
  freedsx:
    build:
      context: .
      dockerfile: Dockerfile
    image: freedsx-profile:latest
    container_name: freedsx-profile
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - ../..:/app:rw
    working_dir: /app
    command: ["sleep", "infinity"]
    cpus: ${PROFILE_CPUS:-4}
    depends_on:
      - mysql
      - openldap
    environment:
      MYSQL_DSN: "mysql:host=mysql;port=3306;dbname=freedsx"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"

  freedsx-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: freedsx-profile:latest
    container_name: freedsx-profile-server
    cpus: ${PROFILE_CPUS:-4}
    cpuset: ${SERVER_CPUSET:-}
    ports:
      - "10389:10389"
    volumes:
      - ../..:/app:rw
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_DSN: "mysql:host=mysql;port=3306;dbname=freedsx"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
    command:
      - bash
      - -lc
      - >
        test -f vendor/autoload.php || composer install --no-interaction --no-progress;
        exec php -d opcache.enable_cli=1 -d opcache.jit_buffer_size=100M -d opcache.jit=${FREEDSX_JIT:-function} tests/bin/ldap-backend-storage.php
        --transport=tcp --storage=${FREEDSX_STORAGE:-sqlite} --runner=${FREEDSX_RUNNER:-pcntl}
        --swoole-workers=${SWOOLE_WORKERS:-1}
        --port=10389 --seed-entries=${SEED_ENTRIES:-25000}
    # Ready only once seeding finishes and the server listens, so `up --wait` blocks until then.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10389'"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 20s

  mysql:
    image: mysql:8.4
    container_name: freedsx-profile-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: freedsx
    command:
      - --innodb-buffer-pool-size=512M
      - --max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    tmpfs:
      - /var/lib/mysql

  openldap:
    # Minimal vanilla slapd for bench comparison
    build:
      context: .
      dockerfile: openldap.Dockerfile
    image: freedsx-profile-openldap:latest
    container_name: freedsx-profile-openldap
    cpus: ${PROFILE_CPUS:-4}
    # Pinned to the same cores as freedsx-server so a comparison measures the server, not core contention.
    cpuset: ${SERVER_CPUSET:-}
    ports:
      - "10390:389"
    healthcheck:
      test: ["CMD", "ldapwhoami", "-x", "-H", "ldap://localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/ldap

  389ds:
    image: quay.io/389ds/dirsrv:latest
    container_name: freedsx-profile-389ds
    cpus: ${PROFILE_CPUS:-4}
    # Pinned to the same cores as freedsx-server so a comparison measures the server, not core contention.
    cpuset: ${SERVER_CPUSET:-}
    ports:
      - "10392:3389"
    environment:
      DS_DM_PASSWORD: "P@ssword12345"
      DS_SUFFIX_NAME: "dc=example,dc=com"
    # The instance answers before the entrypoint applies DS_DM_PASSWORD, so readiness is a successful manager bind.
    healthcheck:
      test: ["CMD-SHELL", "dsconf -D 'cn=Directory Manager' -w \"$$DS_DM_PASSWORD\" ldap://localhost:3389 backend suffix list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # The image creates the instance but not the suffix, so the backend is added once the instance answers.
  389ds-init:
    image: quay.io/389ds/dirsrv:latest
    container_name: freedsx-profile-389ds-init
    depends_on:
      389ds:
        condition: service_healthy
    restart: on-failure
    entrypoint:
      - bash
      - -lc
      - >
        dsconf -D "cn=Directory Manager" -w "P@ssword12345" ldap://389ds:3389 backend suffix list 2>/dev/null | grep -q "dc=example,dc=com"
        || dsconf -D "cn=Directory Manager" -w "P@ssword12345" ldap://389ds:3389 backend create
        --suffix "dc=example,dc=com" --be-name userRoot --create-suffix

  opendj:
    image: openidentityplatform/opendj:latest
    container_name: freedsx-profile-opendj
    cpus: ${PROFILE_CPUS:-4}
    # Pinned to the same cores as freedsx-server so a comparison measures the server, not core contention.
    cpuset: ${SERVER_CPUSET:-}
    ports:
      - "10391:1389"
    environment:
      BASE_DN: "dc=example,dc=com"
      ROOT_USER_DN: "cn=Directory Manager"
      ROOT_PASSWORD: "P@ssword12345"
    healthcheck:
      test: ["CMD-SHELL", "/opt/opendj/bin/ldapsearch -h localhost -p 1389 -D 'cn=Directory Manager' -w 'P@ssword12345' -b '' -s base '(objectClass=*)' 1.1 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
