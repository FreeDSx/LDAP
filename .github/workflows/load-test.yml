name: Load Test
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/performance/**'
      - 'tests/bin/ldap-*.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/load-test.yml'
  push:
    branches: [main, '1.0']
  workflow_dispatch:

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    runs-on: ubuntu-latest
    name: ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: memory-swoole,      backend: memory, runner: swoole, profile: 'memory:swoole',      workers: 1 }
          - { id: sqlite-pcntl,       backend: sqlite, runner: pcntl,  profile: 'sqlite:pcntl',       workers: 1 }
          - { id: sqlite-swoole,      backend: sqlite, runner: swoole, profile: 'sqlite:swoole',      workers: 1 }
          # Worker count left to auto-detect, so the pool is exercised on whatever cores the runner has.
          - { id: sqlite-swoole-pool, backend: sqlite, runner: swoole, profile: 'sqlite:swoole-pool', workers: 0 }
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup extension cache environment
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: '8.5'
          extensions: swoole, pdo_sqlite, pcntl, opcache
          key: load-test-ext-v2

      - name: Cache extensions
        uses: actions/cache@v3
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: swoole, pdo_sqlite, pcntl, opcache
          coverage: none
          tools: composer:2.9
          ini-values: opcache.enable_cli=1, opcache.jit_buffer_size=128M, opcache.jit=tracing

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run load test
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: |
            php tests/bin/ldap-load-test.php \
              --backend=${{ matrix.backend }} \
              --runner=${{ matrix.runner }} \
              --ci-profile=${{ matrix.profile }} \
              --swoole-workers=${{ matrix.workers }} \
              --duration=15 --warmup=3 --clients=16 --rng-seed=1 \
              --output=json \
              --threshold-report=threshold-${{ matrix.id }}.json \
              > raw-${{ matrix.id }}.json

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-${{ matrix.id }}
          path: |
            raw-*.json
            threshold-*.json

  load-test-mysql:
    runs-on: ubuntu-latest
    name: mysql + ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [pcntl, swoole]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: freedsx
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup extension cache environment
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: '8.5'
          extensions: swoole, pdo_mysql, pcntl, opcache
          key: load-test-mysql-ext-v2

      - name: Cache extensions
        uses: actions/cache@v3
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: swoole, pdo_mysql, pcntl, opcache
          coverage: none
          tools: composer:2.9
          ini-values: opcache.enable_cli=1, opcache.jit_buffer_size=128M, opcache.jit=tracing

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run load test
        uses: nick-fields/retry@v3
        env:
          MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=freedsx'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: |
            php tests/bin/ldap-load-test.php \
              --backend=mysql \
              --runner=${{ matrix.runner }} \
              --ci-profile=mysql:${{ matrix.runner }} \
              --swoole-workers=1 \
              --duration=15 --warmup=3 --clients=16 --rng-seed=1 \
              --output=json \
              --threshold-report=threshold-mysql-${{ matrix.runner }}.json \
              > raw-mysql-${{ matrix.runner }}.json

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-mysql-${{ matrix.runner }}
          path: |
            raw-*.json
            threshold-*.json
